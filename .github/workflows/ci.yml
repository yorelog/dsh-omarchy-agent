name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json engines: ^22.19 || >=24
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # lib/ is committed, so a rebuild that changes it means src/ and the
      # published output have drifted apart.
      - name: Check lib/ matches src/
        run: git diff --exit-code -- lib

      - name: Smoke test
        run: node scripts/smoke-test.mjs
